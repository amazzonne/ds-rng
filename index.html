<header>
  <h1>Demon Slayer RNG (Offline)</h1>
</header>

<main>

    <div class="row" style="justify-content:space-between;">
      <div>
        <div class="pill">1–100 lore scale</div>
        <div class="small">Bias + variance + demon chance</div>
      </div>
      <button class="secondary" id="saveBtn">Save</button>
    </div>

    <hr style="border:0;border-top:1px solid #1c2a3a;margin:12px 0;"/>

    <div class="grid2">
      <div>
        <label>How many to generate</label>
        <input type="number" id="count" min="1" max="200" value="3">
      </div>
      <div>
        <label>Demon chance (%)</label>
        <input type="number" id="demonChance" min="0" max="100" value="50">
      </div>
    </div>

    <div style="margin-top:10px;">
      <label>RNG Bias (weak ⇄ OP)</label>
      <input type="range" id="bias" min="-100" max="100" value="0">
      <div class="small" id="biasLabel">Bias: 0</div>
    </div>

    <div style="margin-top:10px;">
      <label>Variance (tight ⇄ wild)</label>
      <input type="range" id="variance" min="0" max="30" value="10">
      <div class="small" id="varLabel">Variance: ±10</div>
    </div>

    <div class="grid2" style="margin-top:10px;">
      <div>
        <label>Overall min</label>
        <input type="number" id="minOverall" min="0" max="200" value="15">
      </div>
      <div>
        <label>Overall max</label>
        <input type="number" id="maxOverall" min="0" max="200" value="100">
      </div>
    </div>

    <hr style="border:0;border-top:1px solid #1c2a3a;margin:12px 0;"/>

    <div class="row">
      <button id="genBtn">Generate</button>
      <button class="secondary" id="copyBtn">Copy JSON</button>
    </div>

    <div class="small" style="margin-top:10px;">
      Install: open in Safari → Share → Add to Home Screen. After first load, it works offline.
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;">
      <div>
        <div class="pill">Output</div>
        <div class="small">Includes Combat Rating + Overall</div>
      </div>
    </div>
    <div class="out" id="output"></div>
  </section>
</main>

/** ===== Combat Rating ===== */
function combatRating(stats, alignment){
  if (alignment === "Slayer") {
    return Math.round(
      0.22*stats.pwr + 0.20*stats.spd + 0.18*stats.dur + 0.22*stats.skl + 0.13*stats.mind + 0.05*stats.flex
    );
  }
  return Math.round(
    0.24*stats.pwr + 0.20*stats.spd + 0.26*stats.dur + 0.15*stats.skl + 0.10*stats.mind + 0.05*stats.flex
  );
}

/** ===== RNG ===== */
function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
function randNormal(){
  let u=0,v=0; while(u===0) u=Math.random(); while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function weightedPick(items, weights){
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<items.length;i++){ r -= weights[i]; if(r<=0) return items[i]; }
  return items[items.length-1];
}
function biasWeight(overall, bias){
  const exp = 0.2 + (Math.abs(bias)/100) * 2.8;
  const x = clamp(overall, 1, 200) / 100;
  return (bias >= 0) ? Math.pow(x, exp) : Math.pow(1/x, exp);
}
function rollStats(base, variance, bias){
  const tilt = Math.round((bias/100) * 6);
  const out = {};
  for (const k of Object.keys(base)){
    const noise = Math.round(randNormal() * variance);
    out[k] = clamp(base[k] + noise + tilt, 1, 150);
  }
  return out;
}

/** ===== UI ===== */
const KEY = "ds_rng_settings_v1";
const outEl = document.getElementById("output");
const biasEl = document.getElementById("bias");
const varEl = document.getElementById("variance");
const biasLabel = document.getElementById("biasLabel");
const varLabel = document.getElementById("varLabel");

function saveSettings(){
  const s = {
    count: document.getElementById("count").value,
    demonChance: document.getElementById("demonChance").value,
    bias: biasEl.value,
    variance: varEl.value,
    minOverall: document.getElementById("minOverall").value,
    maxOverall: document.getElementById("maxOverall").value,
  };
  localStorage.setItem(KEY, JSON.stringify(s));
}
function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(KEY) || "null"); }catch{ return null; }
}
(function init(){
  const s = loadSettings();
  if(s){
    document.getElementById("count").value = s.count ?? 3;
    document.getElementById("demonChance").value = s.demonChance ?? 50;
    biasEl.value = s.bias ?? 0;
    varEl.value = s.variance ?? 10;
    document.getElementById("minOverall").value = s.minOverall ?? 15;
    document.getElementById("maxOverall").value = s.maxOverall ?? 100;
  }
  biasLabel.textContent = `Bias: ${biasEl.value}`;
  varLabel.textContent = `Variance: ±${varEl.value}`;
  outEl.textContent = "Tap Generate.";
})();

biasEl.addEventListener("input", ()=> biasLabel.textContent = `Bias: ${biasEl.value}`);
varEl.addEventListener("input", ()=> varLabel.textContent = `Variance: ±${varEl.value}`);

function rollAlignment(template){
  if(template.typeHint === "Demon" || template.typeHint === "Slayer") return template.typeHint;
  const chance = Number(document.getElementById("demonChance").value);
  return (Math.random()*100 < chance) ? "Demon" : "Slayer";
}
function cryptoId(){
  const arr = new Uint32Array(2);
  (crypto?.getRandomValues ?? ((a)=>{ for(let i=0;i<a.length;i++) a[i]=Math.floor(Math.random()*2**32); return a; }))(arr);
  return [...arr].map(n=>n.toString(16)).join("-");
}
function generate(){
  const count = clamp(Number(document.getElementById("count").value), 1, 200);
  const bias = Number(biasEl.value);
  const variance = Number(varEl.value);
  const minO = Number(document.getElementById("minOverall").value);
  const maxO = Number(document.getElementById("maxOverall").value);

  const pool = TEMPLATES.filter(t => t.overall >= minO && t.overall <= maxO);
  if(!pool.length){ outEl.textContent = "No templates in that Overall range."; return; }

  const weights = pool.map(t => biasWeight(t.overall, bias));
  const chars = [];

  for(let i=0;i<count;i++){
    const template = weightedPick(pool, weights);
    const alignment = rollAlignment(template);
    const rolled = rollStats(template.stats, variance, bias);
    const cr = combatRating(rolled, alignment);

    chars.push({
      id: cryptoId(),
      alignment,
      template: template.name,
      overall: template.overall,
      stats: { PWR: rolled.pwr, SPD: rolled.spd, "DUR/REG": rolled.dur, SKL: rolled.skl, MIND: rolled.mind, FLEX: rolled.flex },
      combatRating: cr
    });
  }

  outEl.textContent = JSON.stringify(chars, null, 2);
}

document.getElementById("genBtn").addEventListener("click", generate);
document.getElementById("saveBtn").addEventListener("click", ()=>{ saveSettings(); alert("Saved."); });
document.getElementById("copyBtn").addEventListener("click", async ()=>{
  try{ await navigator.clipboard.writeText(outEl.textContent || ""); alert("Copied JSON."); }
  catch{ alert("Copy blocked—select text manually and copy."); }
});

/** ===== Register service worker (offline) ===== */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>

</html>
